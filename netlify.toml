[build]
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ics/*"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
