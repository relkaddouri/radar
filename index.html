<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0D18" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar">
<meta name="description" content="Agenda sport et actus personnalisées, en français et en arabe.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)} body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
<script>window.RADAR_PWA=true;</script>
<title>Radar Sport &amp; Actus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap">
<style>
/* Radar v13 — "édition du jour".
   One bold element: the radar on the home screen (night-blue panel, majorelle rings, saffron blip = next must-watch).
   Everything else quiet: grouped lists with hairlines, sentence case, Schibsted Grotesk for UI, Newsreader for reading.
   Claude-written content is always marked with the spark on a majorelle tint. The home screen ends: "Fin de l'édition". */
:root{
  --bg:#F4F4F8; --surface:#FFFFFF; --raised:#F0EFF6; --ink:#17162A; --muted:#62617A; --line:#E2E1EB;
  --accent:#4B3FD8; --accent-ink:#FFFFFF; --soft:#ECEAFC;
  --nuit:#17144A; --nuit2:#262070; --nuit-ink:#F4F2FF; --nuit-muted:#ABA5E6;
  --safran:#F2A92E; --safran-ink:#2A1A00; --star:#E09A10;
  --foot:#1E8549; --tennis:#6F7E00; --f1:#D2232A; --boxe:#9A4F1C; --mma:#6A3E9E; --basket:#D9600F; --culture:#A97A1E;
  --maroc:#C1272D; --tech:#0B6E99; --geo:#7D4A2E; --ux:#4F55D6; --art:#A97A1E; --cinema:#9C3555; --enfant:#C2407A; --monte:#2E7D6B;
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --arabic:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --arabic-serif:"Noto Naskh Arabic","IBM Plex Sans Arabic",serif;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E0D18; --surface:#18172A; --raised:#211F36; --ink:#EEEDF7; --muted:#A4A3BC; --line:#2C2B44;
  --accent:#9389FF; --accent-ink:#120F33; --soft:#24214B;
  --nuit:#141043; --nuit2:#221C66;
  --star:#F2C14E;
  --foot:#4CC27E; --tennis:#C3D23A; --f1:#FF5A5F; --boxe:#D99060; --mma:#AE86E6; --basket:#FF8B3D; --culture:#E3B456;
  --maroc:#FF6B6F; --tech:#4DB3E0; --geo:#D9905F; --ux:#8E93FF; --art:#E3B456; --cinema:#E77C9C; --enfant:#EE7EAE; --monte:#5CC2A8;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E0D18; --surface:#18172A; --raised:#211F36; --ink:#EEEDF7; --muted:#A4A3BC; --line:#2C2B44;
  --accent:#9389FF; --accent-ink:#120F33; --soft:#24214B;
  --nuit:#141043; --nuit2:#221C66;
  --star:#F2C14E;
  --foot:#4CC27E; --tennis:#C3D23A; --f1:#FF5A5F; --boxe:#D99060; --mma:#AE86E6; --basket:#FF8B3D; --culture:#E3B456;
  --maroc:#FF6B6F; --tech:#4DB3E0; --geo:#D9905F; --ux:#8E93FF; --art:#E3B456; --cinema:#E77C9C; --enfant:#EE7EAE; --monte:#5CC2A8;
  color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
#app[dir="rtl"]{font-family:var(--arabic);font-size:16px;line-height:1.7}
button{font:inherit;color:inherit}
a{color:inherit}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.statusbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:680px;margin:0 auto;padding:0 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
.min{min-width:0}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:14px 0 6px;margin-inline:-16px;padding-inline:16px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-weight:800;font-size:27px;line-height:1.1;letter-spacing:-.02em}
[dir="rtl"] .top h1{font-size:24px;letter-spacing:0;line-height:1.4}
.top .sub{font-size:13px;color:var(--muted);margin-top:3px}
.gear{border:0;background:var(--surface);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none;box-shadow:0 0 0 1px var(--line)}
.gear svg{width:21px;height:21px}
.gear[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 4px;margin-inline:-16px;scrollbar-width:none;scroll-padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-weight:600;font-size:14px;line-height:1.2;border:0;background:var(--surface);box-shadow:0 0 0 1px var(--line);padding:8px 13px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.chip .ti{width:16px;height:16px}
.chip[aria-pressed="true"] .ti{color:inherit}
.backbar{display:flex;align-items:center}
.back{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:16px;cursor:pointer;padding:6px 0;display:inline-flex;align-items:center;gap:6px}
.status{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;font-weight:600;border-radius:12px;padding:8px 12px;background:var(--soft);color:var(--ink)}
.status.ok{background:color-mix(in srgb,var(--foot) 16%,var(--surface))}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 30%,transparent);border-top-color:var(--accent);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- icons, labels ---------- */
.ti{display:inline-flex;width:16px;height:16px;flex:none;color:var(--c,var(--muted))}
.ti svg{width:100%;height:100%}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none;display:inline-block}
.kick{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.kick .lab{color:var(--c,var(--ink));font-weight:700}
.kick .ti{width:15px;height:15px}
.kick .cmp{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd small{margin-inline-start:3px}
.new{display:inline-flex;align-items:center;font-size:11px;font-weight:700;color:var(--safran-ink);background:var(--safran);border-radius:999px;padding:1px 7px;line-height:1.5;transition:opacity .6s;flex:none}
.new.gone{opacity:.4}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- sections ---------- */
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 10px}
.sec-h h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
[dir="rtl"] .sec-h h2{font-size:19px;letter-spacing:0}
.sec-h small{font-size:13px;color:var(--muted);font-weight:600}
.link{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;padding:4px 0;white-space:nowrap;flex:none;text-decoration:none}
.note{font-size:13px;color:var(--muted);margin:10px 4px 0;line-height:1.5}
.empty{margin-top:16px;padding:22px;border-radius:16px;background:var(--surface);color:var(--muted);text-align:center}

/* grouped list (one surface, hairlines between rows) */
.group{background:var(--surface);border-radius:18px;overflow:hidden}
.group > * + *{border-top:1px solid var(--line)}
.rowlink{display:flex;gap:12px;align-items:center;padding:12px 14px;text-decoration:none;color:var(--ink);background:transparent;border:0;width:100%;text-align:start;cursor:pointer}
.rowlink:active{background:var(--raised)}
.rowlink h3{margin:2px 0 0;font-size:16px;line-height:1.35;font-weight:700}
[dir="rtl"] .rowlink h3{line-height:1.6}
.rowlink .src{font-size:13px;color:var(--muted);margin-top:2px}
.th{display:block;flex:none;border-radius:12px;overflow:hidden;background:var(--raised)}
.th img{display:block;width:100%;height:100%;object-fit:cover}
.th.sq{width:68px;height:68px}
.th.wide{width:112px;height:63px;border-radius:10px}

/* ---------- radar hero ---------- */
.radar{position:relative;margin-top:10px;border-radius:24px;padding:18px 18px 8px;color:var(--nuit-ink);background:radial-gradient(120% 90% at 0% 0%,var(--nuit2) 0%,var(--nuit) 60%);overflow:hidden}
.radar-top{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
[dir="rtl"] .radar-top{grid-template-columns:132px 1fr}
.radar svg.scope{width:132px;height:132px;display:block;overflow:visible}
.scope .ring{fill:none;stroke:var(--nuit-muted);stroke-opacity:.38;stroke-width:1}
.scope .axis{stroke:var(--nuit-muted);stroke-opacity:.18;stroke-width:1}
.scope .rl{fill:var(--nuit-muted);fill-opacity:.85;font:600 8px var(--sans)}
.scope .sweep{transform-origin:66px 66px;animation:sweep 7s linear infinite}
.scope .blip{stroke:var(--nuit);stroke-width:1.5}
.scope .pulse{fill:none;stroke:var(--safran);stroke-width:1.5;transform-origin:center;transform-box:fill-box;animation:pulse 2.4s ease-out infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.cd-lab{font-size:13px;color:var(--nuit-muted);font-weight:600}
.cd{font-size:40px;line-height:1.05;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--safran);margin-top:2px;white-space:nowrap}
.cd small{font-size:20px;font-weight:700;letter-spacing:-.01em;margin-inline:2px 6px}
[dir="rtl"] .cd{letter-spacing:0;font-size:34px}
.radar .kick{color:var(--nuit-muted);margin-top:4px}
.radar .kick .lab{color:var(--nuit-ink)}
.radar .kick .ti{color:var(--nuit-ink)}
.radar h2{margin:14px 0 2px;font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
[dir="rtl"] .radar h2{letter-spacing:0;line-height:1.45}
.radar .when{margin:0;font-size:14px;color:var(--nuit-muted)}
.radar-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn-n{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;background:rgba(255,255,255,.12);color:var(--nuit-ink)}
.btn-n.solid{background:var(--safran);color:var(--safran-ink)}
.btn-n svg{width:16px;height:16px}
.radar-list{list-style:none;margin:14px 0 0;padding:0}
.radar-list li + li{border-top:1px solid rgba(255,255,255,.1)}
.radar-list button{display:grid;grid-template-columns:auto 10px 1fr;gap:10px;align-items:center;width:100%;border:0;background:transparent;color:var(--nuit-ink);text-align:start;padding:10px 0;cursor:pointer;font-size:15px}
.radar-list .t{font-weight:700;font-size:14px;color:var(--nuit-muted);white-space:nowrap;min-width:84px}
.radar-list .nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- edition strip & end ---------- */
.edition{margin-top:12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.edition::-webkit-scrollbar{display:none}
.edition button{flex:none;display:inline-flex;align-items:baseline;gap:6px;border:0;background:var(--surface);border-radius:14px;padding:10px 14px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}
.edition b{font-size:20px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.edition .done{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted);padding:10px 2px}
.fin{margin:40px 0 8px;text-align:center;color:var(--muted)}
.fin svg{width:44px;height:44px;color:var(--accent)}
.fin b{display:block;font-size:17px;color:var(--ink);margin-top:6px}
.fin span{font-size:14px}

/* ---------- brief ---------- */
.brief{background:var(--surface);border-radius:18px;padding:4px 16px}
.brief li{list-style:none;padding:12px 0}
.brief ul{margin:0;padding:0}
.brief li + li{border-top:1px solid var(--line)}
.brief .lab{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--c)}
.brief .lab .ti{width:15px;height:15px}
.brief p{margin:3px 0 0;font-family:var(--serif);font-size:18px;line-height:1.4;font-weight:450}
[dir="rtl"] .brief p{font-family:var(--arabic-serif);font-size:18px;line-height:1.75}

/* ---------- lead story ---------- */
.lead{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border-radius:20px;overflow:hidden;border:0;padding:0;width:100%;text-align:start;cursor:pointer}
.lead .ph{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--raised)}
.lead .bd{padding:12px 16px 16px}
.lead h3{margin:6px 0 4px;font-size:21px;line-height:1.2;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
[dir="rtl"] .lead h3{letter-spacing:0;line-height:1.5}
.lead p{margin:0;font-size:15px;color:var(--muted)}
.lead + .group{margin-top:10px}

/* ---------- results ---------- */
.score{display:inline-block;font-weight:800;font-size:15px;color:var(--c,var(--ink));line-height:1.35;margin-top:2px}

/* ---------- agenda ---------- */
.day{margin-top:24px}
.dayhead{display:flex;align-items:baseline;gap:8px;margin:0 4px 8px}
.dayhead b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.dayhead b::first-letter{text-transform:uppercase}
.dayhead small{font-size:13px;font-weight:600;color:var(--muted)}
.dayhead small.soon{color:var(--accent)}
details.ev{position:relative}
details.ev > summary{list-style:none;display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
details.ev > summary::-webkit-details-marker{display:none}
details.ev.top3::before{content:"";position:absolute;inset-block:10px;inset-inline-start:0;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
[dir="rtl"] details.ev.top3::before{border-radius:3px 0 0 3px}
details.ev[open] > summary{background:var(--raised)}
.time{font-weight:800;font-size:17px;line-height:1.15;white-space:nowrap}
.time small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:1px}
.time.word{font-size:14px}
.ev h3{margin:1px 0 0;font-size:16px;line-height:1.3;font-weight:700;text-wrap:balance}
[dir="rtl"] .ev h3{line-height:1.6}
.ev .kick{font-size:13px}
.ev .tags{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
.lvl3{font-size:12px;font-weight:700;color:var(--c)}
.side{display:flex;align-items:center;gap:2px}
.star{border:0;background:transparent;color:var(--line);font-size:22px;line-height:1;cursor:pointer;padding:8px;margin:-8px}
.star[aria-pressed="true"]{color:var(--star)}
.ev-more{padding:2px 14px 14px calc(54px + 26px);display:grid;gap:10px;background:var(--raised)}
[dir="rtl"] .ev-more{padding:2px calc(54px + 26px) 14px 14px}
.ev-more p{margin:0;font-size:14px;color:var(--muted)}
.ev-more .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface);box-shadow:0 0 0 1px var(--line);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.btn[aria-pressed="true"]{background:var(--raised);color:var(--muted);box-shadow:none}

/* ---------- Claude-written ---------- */
.ai{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--accent)}
.ai svg{width:15px;height:15px}
.an{display:grid;gap:8px;width:100%;text-align:start;cursor:pointer;color:var(--ink);font:inherit;border:0;border-radius:20px;padding:0;overflow:hidden;background:var(--soft)}
.an .ph{display:block;width:100%;aspect-ratio:2/1;object-fit:cover}
.an .bd{padding:14px 16px 16px;display:grid;gap:6px}
.an h3{margin:0;font-size:20px;line-height:1.2;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
[dir="rtl"] .an h3{letter-spacing:0;line-height:1.5}
.an p{margin:0;font-size:15px;color:var(--muted)}
.an-list{display:grid;gap:12px}
.an.small{grid-template-columns:1fr}
.anlink{display:inline-flex;align-items:center;gap:6px}

/* ---------- reads ---------- */
.rd .rowlink{align-items:flex-start}
.rowlink > .min{flex:1}
.rd .rowlink.done{opacity:.55}
.rd .meta2{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.rd .fiche{color:var(--accent);font-weight:600}

/* ---------- screens ---------- */
.rail{display:flex;gap:12px;overflow-x:auto;margin-inline:-16px;padding:0 16px 4px;scroll-snap-type:x mandatory;scroll-padding-inline:16px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.poster{flex:0 0 232px;scroll-snap-align:start;text-align:start;border:0;background:transparent;padding:0;cursor:pointer;color:var(--ink)}
.poster .art{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/10;background:var(--raised)}
.poster .art img{width:100%;height:100%;object-fit:cover;display:block}
.plat{position:absolute;inset-inline-start:8px;top:8px;font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;color:#fff;background:var(--pc,#333)}
.poster h3{margin:8px 2px 0;font-size:16px;line-height:1.3;font-weight:750}
.poster small{display:block;margin:1px 2px 0;font-size:13px;color:var(--muted)}
.scr-row .rowlink{align-items:center}
.scr-row .k{font-size:13px;color:var(--muted);margin-top:2px}
.pickmark{font-size:12px;font-weight:700;color:var(--cinema)}
.bo li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:baseline;padding:10px 14px;font-size:15px;list-style:none}
.bo ol{margin:0;padding:0}
.bo .r{font-weight:800;color:var(--accent)}
.bo small{color:var(--muted);font-size:13px}
.bo h3{margin:0;padding:12px 14px 4px;font-size:14px;font-weight:700;color:var(--muted)}
.bo .src{padding:8px 14px 12px;font-size:12px;color:var(--muted)}
.bo + .bo{margin-top:10px}

/* ---------- reader ---------- */
.reader{max-width:640px;margin:6px auto 0;display:grid;gap:16px}
.reader h1{margin:0;font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
[dir="rtl"] .reader h1{line-height:1.5;font-size:25px;letter-spacing:0}
.reader .dek{margin:0;font-family:var(--serif);font-size:19px;line-height:1.45;color:var(--muted)}
[dir="rtl"] .reader .dek{font-family:var(--arabic-serif);font-size:18px;line-height:1.8}
.reader h2{margin:10px 0 0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.reader p.body{margin:0;font-family:var(--serif);font-size:19px;line-height:1.6}
[dir="rtl"] .reader p.body{font-family:var(--arabic-serif);font-size:19px;line-height:1.95}
.reader figure{margin:0 -16px}
.reader .hero{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--raised)}
.reader figcaption{font-size:12px;color:var(--muted);margin:6px 16px 0}
.reader .resume{display:grid;gap:12px}
.reader ul.pts{margin:0;padding-inline-start:20px;display:grid;gap:8px}
.reader ul.pts li{font-size:16px;line-height:1.5}
.reader .chips-in{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border-radius:999px;padding:3px 10px}
.keybox{border-radius:16px;padding:14px 16px;background:color-mix(in srgb,var(--c,var(--accent)) 12%,var(--surface))}
.keybox b{display:block;font-size:13px;font-weight:700;color:var(--c,var(--accent));margin-bottom:4px}
.keybox p{margin:0;font-size:17px;line-height:1.45;font-weight:650}
.fy{border-radius:16px;padding:14px 16px;background:var(--soft)}
.fy b{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:13px;margin-bottom:4px}
.fy b svg{width:15px;height:15px}
.fy p{margin:0;font-size:16px;line-height:1.5}
.srcs{margin:0;padding-inline-start:18px;display:grid;gap:6px;font-size:14px}
.srcs a{color:var(--accent)}
.fine{font-size:13px;color:var(--muted);margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.vidbox{position:relative;display:block;border-radius:16px;overflow:hidden;aspect-ratio:16/9;background:var(--raised)}
.vidbox img{width:100%;height:100%;object-fit:cover;display:block}
.vidbox span{position:absolute;inset-inline-start:12px;bottom:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(10,8,30,.78);color:#fff;font-size:14px;font-weight:700;border-radius:999px;padding:7px 13px}
.vidbox svg{width:15px;height:15px}
.vid-link{display:inline-flex;gap:6px;align-items:center;font-weight:600;font-size:14px;color:var(--accent);text-decoration:none}
.vid-link svg{width:15px;height:15px}

/* ---------- settings ---------- */
.panel{background:var(--surface);border-radius:18px;padding:2px 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row label{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;flex:1}
.row label .ti{width:20px;height:20px}
.toggle{appearance:none;-webkit-appearance:none;width:48px;height:29px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:inset-inline-start .15s}
.toggle:checked{background:var(--accent)}
.toggle:checked::after{inset-inline-start:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);padding:4px;border-radius:14px}
.seg button{border:0;border-radius:10px;padding:10px;background:transparent;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button[lang="ar"]{font-family:var(--arabic)}
.sub-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;flex-wrap:wrap}
.toolbar{display:flex;justify-content:flex-end;margin-top:6px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.nav .ic{position:relative;display:inline-flex;padding:3px 14px;border-radius:999px}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .ic{background:var(--soft);color:var(--accent)}
.badge{position:absolute;top:-4px;inset-inline-end:2px;min-width:18px;height:18px;border-radius:9px;background:var(--safran);color:var(--safran-ink);font-size:11px;font-weight:800;padding:0 5px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){
  .spin,.scope .sweep,.scope .pulse{animation:none}
  .scope .pulse{opacity:0}
  .toggle,.toggle::after,.new{transition:none}
}

function radarHero(){

  const next = ups.find(e=>e.level>=3) || ups[0];

  const R = h => h<=24 ? 6+h/24*14 : h<=72 ? 20+(h-24)/48*20 : 40+Math.min(1,(h-72)/96)*20;

  });
  const wedge = `M66 66 L66 4 A62 62 0 0 1 ${(66+62*Math.sin(Math.PI/5)).toFixed(1)} ${(66-62*Math.cos(Math.PI/5)).toFixed(1)} Z`;
  const svg = `<svg class="scope" viewBox="0 0 132 132" aria-hidden="true">
    <defs><linearGradient id="swg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9389FF" stop-opacity="0"/><stop offset="1" stop-color="#9389FF" stop-opacity=".45"/></linearGradient></defs>
    <line class="axis" x1="66" y1="2" x2="66" y2="130"/><line class="axis" x1="2" y1="66" x2="130" y2="66"/>
    <circle class="ring" cx="66" cy="66" r="20"/><circle class="ring" cx="66" cy="66" r="40"/><circle class="ring" cx="66" cy="66" r="62"/>
    <text class="rl" x="69" y="${66+20-3}">${esc(t.ring[0])}</text><text class="rl" x="69" y="${66+40-3}">${esc(t.ring[1])}</text><text class="rl" x="69" y="${66+62-3}">${esc(t.ring[2])}</text>
    <g class="sweep"><path d="${wedge}" fill="url(#swg)"/></g>
    <circle cx="66" cy="66" r="2.2" fill="var(--nuit-ink)"/>
    ${blips.map(b=>b.first
      ? `<circle class="pulse" cx="${b.x}" cy="${b.y}" r="5.5"/><circle class="blip" cx="${b.x}" cy="${b.y}" r="5.5" style="fill:var(--safran)"/>`
      : `<circle class="blip" cx="${b.x}" cy="${b.y}" r="3.6" style="fill:var(${SPORT_C[b.e.sport]||"--nuit-muted"})"/>`).join("")}
  </svg>`;
  const s=pStart(next), an=analysisFor(next);

  const acts = [
    `<a class="btn-n solid" href="${esc(calHref(next))}" ${window.RADAR_PWA?"":'target="_blank" rel="noopener"'}>${ICONS.cal}${esc(t.addCal)}</a>`,
    an?`<button class="btn-n" data-open="an" data-k="${esc(an.id)}">${ICONS.spark}${esc(t.readAn)}</button>`:"",
    next.video&&next.video.url?`<a class="btn-n" href="${esc(next.video.url)}" target="_blank" rel="noopener">${ICONS.play}${esc(t.vid[next.video.kind]||t.vid.promo)}</a>`:""
  ].join("");
  const list = week.slice(0,4).map(e=>{ const d=pStart(e);
    const tt = isDateOnly(e) ? cap(fmt(d,{weekday:"short",day:"numeric"})) : cap(fmt(d,{weekday:"short"}))+" "+hm(d);

    <h3 class="clamp3">${esc(tx(n,"title"))}</h3><div class="src">${esc(n.source||"")}, ${esc(shortDate(n.date))}${n.video?` · ▶`:""}</div></div>${thumbBox(n.image,"sq")}</button>`;
}
function readRow(x){
  const t=L(); let label=t.cats[x.cat]||x.cat, col=CAT_C[x.cat]||"--muted";
  if (x.cat==="sport" && t.sports[x.sport]){ label=t.sports[x.sport]; col=SPORT_C[x.sport]; }
  const done=readDone.has(x.url), fiche = x.resume || (Array.isArray(x.points)&&x.points.length);
  return `<button class="rowlink ${done?"done":""}" data-open="read" data-k="${esc(x.url)}" style="--c:var(${col})">${thumbBox(x.image,"sq")}<div class="min">
    <div class="kick">${ico(x.cat==="sport"&&TI[x.sport]?x.sport:x.cat)}<span class="lab">${esc(label)}</span>${done?"":newTag(x.url)}</div>
    <h3 class="clamp3">${esc(tx(x,"title"))}</h3>
    <div class="meta2"><span>${esc(x.source||"")}</span><span>${esc(String(x.minutes||"?"))} ${esc(t.min)}</span>${fiche?`<span class="fiche">${esc(t.ed.fiche)}</span>`:""}${done?`<span>${esc(t.isRead)}</span>`:""}</div></div></button>`;
}
function resultRow(ev){
  return `<button class="rowlink" data-go="agenda" style="--c:var(${SPORT_C[ev.sport]||"--muted"})"><div class="min">
    <div class="kick">${ico(ev.sport)}<span class="lab">${esc(sportLabel(ev))}</span><span class="cmp">${esc(tx(ev,"comp"))}</span>${newTag(resKey(ev))}</div>
    <h3>${esc(tx(ev,"title"))}</h3><span class="score">${esc(tx(ev,"result"))}</span></div></button>`;
}
function posterCard(x){
  const t=L(), T=t.scr;
  const d = x.date ? fmt(new Date(x.date+"T12:00:00"),{day:"numeric",month:"short"}) : "";
  return `<button class="poster" data-open="scr" data-k="${esc(x.id)}"><div class="art">${imgOk(x.image)?`<img src="${esc(x.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}<span class="plat" style="--pc:${PLAT_C[x.platform]||"#333"}">${esc(x.platform||"")}</span></div>
    <h3 class="clamp2">${esc(tx(x,"title"))}</h3><small>${esc(x.kind==="serie"?T.serie:T.film)}, ${esc((x.status==="soon"?T.outOn:T.out)+d)}</small></button>`;
}
function scrRow(x){
  const t=L(), T=t.scr;
  const d = x.date ? fmt(new Date(x.date+"T12:00:00"),{day:"numeric",month:"short"}) : "";
  return `<button class="rowlink" data-open="scr" data-k="${esc(x.id)}">${thumbBox(x.image,"wide")}<div class="min">
    ${(x.pick||isNew(scrKey(x)))?`<div class="kick">${x.pick?`<span class="pickmark">${esc(T.pick)}</span>`:""}${newTag(scrKey(x))}</div>`:""}
    <h3 class="clamp2">${esc(tx(x,"title"))}</h3>
    <div class="k">${esc(x.platform||"")}, ${esc((x.status==="soon"?T.outOn:T.out)+d)}</div>
    <div class="k">${esc(x.kind==="serie"?T.serie:T.film)} · ${esc(tx(x,"genre"))}</div></div></button>`;
}

/* ---------- views ---------- */
function viewHome(){
  const t=L();
  let html = radarHero();
  html += editionStrip();
  const brief = state.meta && (state.lang==="ar" ? state.meta.brief_ar : state.meta.brief);
  const BRIEF_K = {sport:"sport",maroc:"maroc",monde:"geo",tech:"tech",culture:"culture","رياضة":"sport","المغرب":"maroc","العالم":"geo","تكنولوجيا":"tech","ثقافة":"culture"};
  const BRIEF_C = {sport:"--foot",maroc:"--maroc",monde:"--geo",tech:"--tech",culture:"--art","رياضة":"--foot","المغرب":"--maroc","العالم":"--geo","تكنولوجيا":"--tech","ثقافة":"--art"};
  if (Array.isArray(brief) && brief.length){
    html += `<section class="sec"><div class="sec-h"><h2>${esc(t.briefTitle)}</h2></div><div class="brief"><ul>${brief.map(x=>{
      const m=String(x).match(/^\s*([^:：]{2,16})\s*[:：]\s*(.+)$/s);
      const lab=m?m[1].trim():"", raw=m?m[2]:String(x), key=lab.toLowerCase();
      return `<li style="--c:var(${BRIEF_C[key]||BRIEF_C[lab]||"--accent"})">${lab?`<span class="lab">${ico(BRIEF_K[key]||BRIEF_K[lab])}${esc(lab)}</span>`:""}<p>${esc(cap(raw))}</p></li>`;
    }).join("")}</ul></div></section>`;
  }
  const res = recentResults().slice(0,3);
  if (res.length) html += `<section class="sec"><div class="sec-h"><h2>${esc(t.results)}</h2><button class="link" data-go="agenda">${esc(t.seeAgenda)}</button></div><div class="group">${res.map(resultRow).join("")}</div></section>`;
  const cats = Object.keys(CAT_C).filter(catOn);
  const heads = cats.map(c=>newsFor(c)[0]).filter(Boolean);
  if (heads.length){
    const leadI = Math.max(0, heads.findIndex(n=>imgOk(n.image)));
    const lead = heads[leadI], rest = heads.filter((_,i)=>i!==leadI);
    html += `<section class="sec"><div class="sec-h"><h2>${esc(t.headlines)}</h2><button class="link" data-go="news">${esc(t.seeNews)}</button></div>${newsLead(lead)}${rest.length?`<div class="group">${rest.map(n=>newsRow(n,true)).join("")}</div>`:""}</section>`;
  }
  const an = analysesList()[0];
  const tonight = readsList().filter(x=>!readDone.has(x.url)).slice(0,3);
  if (an || tonight.length){
    html += `<section class="sec"><div class="sec-h"><h2>${esc(t.readTonight)}</h2><button class="link" data-go="reads">${esc(t.seeReads)}</button></div>${an?anCard(an):""}${tonight.length?`<div class="group rd" style="margin-top:${an?10:0}px">${tonight.map(readRow).join("")}</div>`:""}</section>`;
  }
  const picks = catOn("cinema") ? screenItems().filter(x=>x.pick).slice(0,6) : [];
  if (picks.length) html += `<section class="sec"><div class="sec-h"><h2>${esc(t.scr.home)}</h2><button class="link" data-go="screens">${esc(t.scr.seeAll)}</button></div><div class="rail">${picks.map(posterCard).join("")}</div></section>`;
  html += `<div class="fin">${RADAR_GLYPH}<b>${esc(t.ed.end)}</b><span>${esc(t.ed.endSub(hm(nextEdition())))}</span></div>`;
  return html;
}
function viewAgenda(){
  const t=L(), now=new Date();
  let evs = upcoming();
  if (state.sportFilter==="fav") evs=evs.filter(e=>stars.has(e.id));
  else if (state.sportFilter!=="all") evs=evs.filter(e=>e.sport===state.sportFilter);
  let past = recentResults();
  if (state.sportFilter==="fav") past=past.filter(e=>stars.has(e.id)); else if (state.sportFilter!=="all") past=past.filter(e=>e.sport===state.sportFilter);
  if (!evs.length && !past.length) return `<div class="empty">${esc(state.sportFilter==="fav"?t.favEmpty:t.noEvents)}</div>`;
  const liveEv = evs.filter(e=>pStart(e)<=now);
  const groups=new Map();
  evs.filter(e=>pStart(e)>now).forEach(e=>{const k=dayKey(pStart(e)); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(e);});
  let html="";
  if (past.length) html += `<section class="day"><div class="dayhead"><b>${esc(t.results)}</b></div><div class="group">${past.map(eventRow).join("")}</div></section>`;
  if (liveEv.length) html += `<section class="day"><div class="dayhead"><b>${esc(t.now)}</b><small class="soon">${esc(t.live)}</small></div><div class="group">${liveEv.map(eventRow).join("")}</div></section>`;
  for (const [,list] of groups){ const d=pStart(list[0]), r=rel(d);
    html += `<section class="day"><div class="dayhead"><b>${esc(fmt(d,{weekday:"long",day:"numeric",month:"long"}))}</b><small class="${r.soon?"soon":""}">${esc(r.t)}</small></div><div class="group">${list.map(eventRow).join("")}</div></section>`; }
  html += `<p class="note">${esc(t.agendaNote)}</p>`;
  return html;
}
function viewNews(){
  const t=L();
  if (state.catFilter!=="all"){
    const items=newsFor(state.catFilter);
    if (!items.length) return `<div class="empty">${esc(t.noNews)}</div>`;
    const li = Math.max(0, items.findIndex(n=>imgOk(n.image)));
    const rest = items.filter((_,i)=>i!==li);
    return `<div style="margin-top:14px">${newsLead(items[li])}${rest.length?`<div class="group">${rest.map(n=>newsRow(n,false)).join("")}</div>`:""}</div>`;
  }
  const cats=Object.keys(CAT_C).filter(catOn);
  const blocks = cats.map((c,ci)=>{ const items=newsFor(c); if(!items.length) return "";
    const fresh=items.filter(n=>isNew(n.url)), old=items.filter(n=>!isNew(n.url));
    const shown=[...fresh, ...old].slice(0, Math.max(4, fresh.length));
    const li = ci===0 ? Math.max(0, shown.findIndex(n=>imgOk(n.image))) : -1;
    const rows = shown.filter((_,i)=>i!==li);
    return `<section class="sec" style="--c:var(${CAT_C[c]})${ci===0?";margin-top:14px":""}"><div class="sec-h"><h2 style="display:flex;align-items:center;gap:8px">${ico(c)}${esc(t.cats[c])}</h2>${items.length>shown.length?`<button class="link" data-cat="${c}">${esc(t.seeAll(items.length))}</button>`:(fresh.length?`<small>${esc(t.nNew(fresh.length))}</small>`:"")}</div>
      ${li>=0?newsLead(shown[li]):""}${rows.length?`<div class="group">${rows.map(n=>newsRow(n,false)).join("")}</div>`:""}</section>`; }).join("");
  return blocks || `<div class="empty">${esc(t.noNews)}</div>`;
}
function viewSettings(){
  const t=L();
  const sp = Object.keys(SPORT_C).map(k=>`<div class="row"><label for="sp-${k}"><span class="ti" style="--c:var(${SPORT_C[k]})">${TI[k]}</span>${esc(t.sports[k])}</label><input type="checkbox" class="toggle" id="sp-${k}" data-sp="${k}" ${sportOn(k)?"checked":""}></div>`).join("");
  const ct = Object.keys(CAT_C).map(k=>`<div class="row"><label for="ct-${k}"><span class="ti" style="--c:var(${CAT_C[k]})">${TI[k]}</span>${esc(t.cats[k])}</label><input type="checkbox" class="toggle" id="ct-${k}" data-ct="${k}" ${catOn(k)?"checked":""}></div>`).join("");
  const base = `${location.host}${location.pathname.replace(/[^/]*$/,"")}`;
  const calSec = window.RADAR_PWA ? `<section class="sec"><div class="sec-h"><h2>${esc(t.calTitle)}</h2></div><div class="panel"><p class="note" style="margin:12px 0 4px">${esc(t.calSub)}</p><div class="sub-row"><a class="btn primary" href="webcal://${base}ics/incontournables.ics">${esc(t.calBtn)}</a><a class="link" href="webcal://${base}ics/tout.ics">${esc(t.calAll)}</a></div></div></section>` : "";
  return calSec + `<section class="sec"><div class="sec-h"><h2>${esc(t.lang)}</h2></div>
      <div class="seg" role="group"><button lang="fr" data-lang="fr" aria-pressed="${state.lang==="fr"}">Français</button><button lang="ar" data-lang="ar" aria-pressed="${state.lang==="ar"}">العربية</button></div></section>
    <section class="sec"><div class="sec-h"><h2>${esc(t.mySports)}</h2></div><div class="panel">${sp}</div></section>
    <section class="sec"><div class="sec-h"><h2>${esc(t.myTopics)}</h2></div><div class="panel">${ct}</div><p class="note">${esc(t.settingsNote)}</p></section>`;
}

let seenObs=null;
function observeSeen(){
  if (seenObs) seenObs.disconnect();
  if (!("IntersectionObserver" in window)) return;
  const timers=new Map();
  seenObs = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      const el=en.target, k=el.dataset.seen;
      if (en.isIntersecting){
        if (!timers.has(el)) timers.set(el, setTimeout(()=>{ seen.add(k); saveSeen(); el.classList.add("gone"); seenObs.unobserve(el); timers.delete(el); renderNav(); }, 1500));
      } else if (timers.has(el)){ clearTimeout(timers.get(el)); timers.delete(el); }
    });
  }, {threshold:0.9});
  document.querySelectorAll("#main [data-seen]").forEach(el=>seenObs.observe(el));
}
function bind(){
  const m=$("#main");
  m.querySelectorAll("[data-open]").forEach(b=>b.onclick=(e)=>{ e.preventDefault(); openDetail(b.dataset.open,b.dataset.k); });
  m.querySelectorAll("[data-seenall]").forEach(b=>b.onclick=()=>{ (b.dataset.seenall==="news"?unseenNews():unseenReads()).forEach(x=>seen.add(x.url)); if(b.dataset.seenall==="reads") unseenAnalyses().forEach(a=>seen.add(anKey(a))); store.set("radar-seen",[...seen].slice(-2000)); render(); });
  m.querySelectorAll("[data-list]").forEach(b=>b.onclick=()=>{ const id=b.dataset.list; myList.has(id)?myList.delete(id):myList.add(id); store.set("radar-mylist",[...myList]); render(); });
  m.querySelectorAll("[data-star]").forEach(b=>b.onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); const id=b.dataset.star; stars.has(id)?stars.delete(id):stars.add(id); store.set("radar-stars",[...stars]); render(); });
  m.querySelectorAll("[data-read]").forEach(b=>b.onclick=()=>{ const u=b.dataset.read; readDone.has(u)?readDone.delete(u):readDone.add(u); store.set("radar-read",[...readDone].slice(-300)); render(); });
  m.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ if(b.dataset.go==="news") state.catFilter="all"; go(b.dataset.go); });
  m.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>go("news",{cat:b.dataset.cat}));
  m.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ state.lang=b.dataset.lang; store.set("radar-lang2",state.lang); render(); });
  m.querySelectorAll("[data-sp]").forEach(i=>i.onchange=()=>{ i.checked?state.hiddenSports.delete(i.dataset.sp):state.hiddenSports.add(i.dataset.sp); store.set("radar-hidden-sports",[...state.hiddenSports]); if(!sportOn(state.sportFilter)) state.sportFilter="all"; });
  m.querySelectorAll("[data-ct]").forEach(i=>i.onchange=()=>{ i.checked?state.hiddenCats.delete(i.dataset.ct):state.hiddenCats.add(i.dataset.ct); store.set("radar-hidden-cats",[...state.hiddenCats]); if(!catOn(state.catFilter)) state.catFilter="all"; });
}
function tick(){
  const el=document.getElementById("count"); if(!el) return;
  const t=L(), C=t.cd, start=new Date(el.dataset.start), now=new Date();
  let ms=start-now;
  if (ms<=0){ el.textContent=t.started; return; }
  if (el.dataset.dateonly==="1"){
    const n=Math.round((sod(start)-sod(now))/864e5);
    el.innerHTML = n<=0 ? esc(C.today) : `${n}<small>${esc(C.d)}</small>`;
    return;
  }
  const d=Math.floor(ms/864e5); ms-=d*864e5; const h=Math.floor(ms/36e5); ms-=h*36e5; const mi=Math.floor(ms/6e4);
  el.innerHTML = d>=1 ? `${d}<small>${esc(C.d)}</small>${h}<small>${esc(C.h)}</small>` : `${h}<small>${esc(C.h)}</small>${String(mi).padStart(2,"0")}<small>${esc(C.m)}</small>`;
}
setInterval(tick, 30000);

function render(scrollTop){
  ensureBaseline();
  if (!state.detail) markTabSeen(state.tab);
  const app=$("#app"); app.dir = state.lang==="ar"?"rtl":"ltr"; app.lang=state.lang;
  document.documentElement.lang = state.lang;
  renderTop(); renderNav();
  const m=$("#main");
  if (state.tab!=="settings" && (!state.events || !state.news || !state.reads)) m.innerHTML = `<div class="empty">${esc(state.err?L()[state.err]:L().loading)}</div>`;
  else if (state.detail) m.innerHTML = viewDetail();
  else m.innerHTML = state.tab==="home"?viewHome():state.tab==="agenda"?viewAgenda():state.tab==="news"?viewNews():state.tab==="reads"?viewReads():state.tab==="screens"?viewScreens():viewSettings();
  bind(); tick(); observeSeen();
  if (scrollTop) window.scrollTo(0,0);
}
render();

/* ---------- data: Claude database when opened in Claude, data.json when installed as an app ---------- */
async function pollStatus(){
  try{
    const r = await fetch("status.json?ts="+Date.now(),{cache:"no-store"});
    if (!r.ok) return;
    const st = await r.json();
    const started = st && st.state==="running" && st.startedAt ? new Date(st.startedAt).getTime() : 0;
    const dataAt = state.meta && state.meta.updatedAt ? new Date(state.meta.updatedAt).getTime() : 0;
    const fresh = started && Date.now()-started < 45*60e3;
    const was = live.running;
    live.running = (fresh && dataAt < started) ? started : null;
    if (live.running){ await loadJson(true); }
    if (was && !live.running){ live.done = Date.now(); setTimeout(()=>renderTop(),8500); }
    renderTop();
  }catch(e){}
}
function apply(d){ state.events=Array.isArray(d.events)?d.events:[]; state.news=Array.isArray(d.news)?d.news:[]; state.reads=Array.isArray(d.reads)?d.reads:[]; state.analyses=Array.isArray(d.analyses)?d.analyses:[]; state.screen=d.screen||null; state.meta=d.meta||null; render(); }
async function loadJson(quiet){
  try{
    const r = await fetch("data.json",{cache:"no-cache"});
    if(!r.ok) throw 0;
    const d = await r.json();
    const prev = state.meta && state.meta.updatedAt;
    if (quiet && prev && d.meta && d.meta.updatedAt===prev) return;
    apply(d);
    state.offline = r.headers.get("x-radar-offline")==="1"; render();
  }catch(e){ state.err = "fail"; render(); }
}
(async()=>{
  if (!window.RADAR_PWA){
    let db=null; try{ db=await window.claude?.use?.("db"); }catch(e){}
    if (!db){ state.err="noDb"; render(); return; }
    const fail=()=>{ state.err="fail"; render(); };
    db.doc("feed/events").onSnapshot(s=>{ const d=s.exists?s.data():null; state.events=d&&Array.isArray(d.items)?d.items:[]; render(); }, fail);
    db.doc("feed/news").onSnapshot(s=>{ const d=s.exists?s.data():null; state.news=d&&Array.isArray(d.items)?d.items:[]; render(); }, fail);
    db.doc("feed/analyses").onSnapshot(s=>{ const d=s.exists?s.data():null; state.analyses=d&&Array.isArray(d.items)?d.items:[]; render(); }, ()=>{});
    db.doc("feed/reads").onSnapshot(s=>{ const d=s.exists?s.data():null; state.reads=d&&Array.isArray(d.items)?d.items:[]; render(); }, fail);
    db.doc("feed/screen").onSnapshot(s=>{ state.screen=s.exists?s.data():null; render(); }, ()=>{});
    db.doc("feed/meta").onSnapshot(s=>{ state.meta=s.exists?s.data():null; render(); }, ()=>{});
  } else {
    loadJson().then(pollStatus);
    setInterval(()=>{ if(document.visibilityState==="visible") pollStatus(); }, 60000);
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") loadJson().then(pollStatus); });
  }
})();
