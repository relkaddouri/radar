<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1319" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar">
<meta name="description" content="Agenda sport et actus personnalisées, en français et en arabe.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)} body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
<script>window.RADAR_PWA=true;</script>
<title>Radar Sport &amp; Actus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell — compact sticky top bar, scrolling content, fixed bottom tab bar (Accueil · Agenda · Actus · Réglages). Home = next must-watch event with countdown + this week + one headline per topic. Arabic flips everything right-to-left. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --raised:#F6F8FA; --ink:#121C26; --muted:#5A6774; --line:#D6DDE4;
  --accent:#0B6E99; --soft:#E1E9EF; --star:#D99A00; --hero-ink:#FFFFFF;
  --foot:#1E8549; --tennis:#6F7E00; --f1:#D2232A; --boxe:#9A4F1C; --mma:#6A3E9E; --basket:#D9600F; --culture:#A97A1E;
  --maroc:#C1272D; --tech:#0B6E99; --geo:#7D4A2E; --ux:#4F55D6; --art:#A97A1E; --cinema:#9C3555; --enfant:#C2407A; --monte:#2E7D6B;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --arabic:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1319; --surface:#161F28; --raised:#1B2631; --ink:#E8EDF2; --muted:#94A2AF; --line:#26323E;
  --accent:#4DB3E0; --soft:#1C2833; --star:#F2C14E; --hero-ink:#FFFFFF;
  --foot:#4CC27E; --tennis:#C3D23A; --f1:#FF5A5F; --boxe:#D99060; --mma:#AE86E6; --basket:#FF8B3D; --culture:#E3B456;
  --maroc:#FF6B6F; --tech:#4DB3E0; --geo:#D9905F; --ux:#8E93FF; --art:#E3B456; --cinema:#E77C9C; --enfant:#EE7EAE; --monte:#5CC2A8;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1319; --surface:#161F28; --raised:#1B2631; --ink:#E8EDF2; --muted:#94A2AF; --line:#26323E;
  --accent:#4DB3E0; --soft:#1C2833; --star:#F2C14E; --hero-ink:#FFFFFF;
  --foot:#4CC27E; --tennis:#C3D23A; --f1:#FF5A5F; --boxe:#D99060; --mma:#AE86E6; --basket:#FF8B3D; --culture:#E3B456;
  --maroc:#FF6B6F; --tech:#4DB3E0; --geo:#D9905F; --ux:#8E93FF; --art:#E3B456; --cinema:#E77C9C; --enfant:#EE7EAE; --monte:#5CC2A8;
  color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app[dir="rtl"]{font-family:var(--arabic);font-size:16px;line-height:1.7}
.statusbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(var(--nav-h) + 32px)}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 8px}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{margin:0;font-family:var(--display);font-weight:700;font-size:32px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
[dir="rtl"] .top h1{font-family:var(--arabic);font-size:24px;line-height:1.3;text-transform:none}
.top .sub{font-size:12px;color:var(--muted);margin-top:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:10px 4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-weight:600;font-size:13px;line-height:1.2;border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.ti{display:inline-flex;width:16px;height:16px;flex:none;color:var(--c,var(--muted))}
.ti svg{width:100%;height:100%}
.chip .ti{width:17px;height:17px}
.chip[aria-pressed="true"] .ti{color:inherit}
.row label .ti{width:20px;height:20px}
.topic-h .ti{width:18px;height:18px}

/* Bottom tab bar */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}

/* Section titles */
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2{margin:0;font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
[dir="rtl"] .sec-h h2{font-family:var(--arabic);font-size:18px;text-transform:none;letter-spacing:0}
.link{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:4px 0;white-space:nowrap;flex:none}

/* Next event ticket */
.next{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;position:relative;overflow:hidden}
.next::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--c)}
.next-count{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:78px;padding:10px 8px;border-radius:10px;background:color-mix(in srgb,var(--c) 14%,var(--surface));text-align:center}
.next-count b{font-family:var(--display);font-size:38px;line-height:1;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums}
.next-count span{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
[dir="rtl"] .next-count span{text-transform:none;letter-spacing:0;font-size:12px}
.next .lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--c)}
[dir="rtl"] .next .lbl{letter-spacing:0;text-transform:none;font-size:12px}
.next h3{margin:3px 0 2px;font-size:19px;line-height:1.25;font-weight:700;text-wrap:balance}
.next p{margin:0;font-size:13px;color:var(--muted)}
.next .when{color:var(--ink);font-weight:600;margin-top:2px}

/* Event rows */
.day{margin-top:20px}
.dayhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.dayhead b{font-family:var(--display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
[dir="rtl"] .dayhead b{font-family:var(--arabic);font-size:17px;text-transform:none;letter-spacing:0}
.dayhead small{font-size:13px;font-weight:600;color:var(--muted)}
.dayhead small.soon{color:var(--accent)}
.list{display:grid;gap:8px}
.ev{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.ev.top3{border-inline-start:4px solid var(--c)}
.time{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums}
.time.word{font-size:15px;line-height:1.2}
.time.range{font-size:18px;white-space:nowrap}
[dir="rtl"] .time.word{font-family:var(--arabic);font-size:13px;line-height:1.5}
.time small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
[dir="rtl"] .time small{font-family:var(--arabic);letter-spacing:0;text-transform:none}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.05em}
[dir="rtl"] .meta{text-transform:none;letter-spacing:0;font-size:13px}
.meta .comp{color:var(--muted);font-weight:600}
.ev h3{margin:2px 0;font-size:16px;line-height:1.3;font-weight:700;text-wrap:balance}
.ev p{margin:0;font-size:13px;color:var(--muted)}
.min{min-width:0}
.side{display:flex;flex-direction:column;align-items:center;gap:8px}
.lvl{display:flex;gap:2px;align-items:flex-end;height:14px}
.lvl i{width:4px;background:var(--line);border-radius:1px}
.lvl i:nth-child(1){height:6px}.lvl i:nth-child(2){height:10px}.lvl i:nth-child(3){height:14px}
.lvl i.on{background:var(--c)}
.star{border:0;background:transparent;color:var(--line);font-size:22px;line-height:1;cursor:pointer;padding:6px;margin:-6px}
.star[aria-pressed="true"]{color:var(--star)}
.legend{font-size:12px;color:var(--muted);margin-top:16px;display:flex;gap:14px;flex-wrap:wrap}

/* News */
.news{display:grid;gap:10px}
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--ink);text-decoration:none}
.card:active{background:var(--raised)}
.card .meta{margin-bottom:4px}
.card h3{margin:0 0 4px;font-size:16px;line-height:1.35;font-weight:700;text-wrap:balance}
[dir="rtl"] .card h3,[dir="rtl"] .ev h3{line-height:1.55}
.card p{margin:0;font-size:14px;color:var(--muted)}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.topic + .topic{margin-top:12px}
.topic-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 4px}
.topic-h .meta{font-size:13px}
.topic a{display:block;padding:10px 14px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.topic-h + a{border-top:0}
.topic a:active{background:var(--raised)}
.topic a b{display:block;font-size:15px;line-height:1.35;font-weight:700}
.topic a small{display:block;font-size:12px;color:var(--muted);margin-top:2px}

/* Home digest */
.digest{display:grid;gap:8px}
.digest a{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);text-decoration:none}
.digest a:active{background:var(--raised)}
.digest .tag{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.05em;padding-top:2px;min-width:74px}
[dir="rtl"] .digest .tag{text-transform:none;letter-spacing:0;font-size:12px}
.digest b{font-size:15px;line-height:1.35;font-weight:700}

/* Settings */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row label{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;flex:1}
.toggle{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:inset-inline-start .15s}
.toggle:checked{background:var(--accent)}
.toggle:checked::after{inset-inline-start:21px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);padding:4px;border-radius:10px}
.seg button{border:0;border-radius:7px;padding:10px;background:transparent;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button[lang="ar"]{font-family:var(--arabic)}
.note{font-size:13px;color:var(--muted);margin:8px 2px 0}

/* Brief, results, calendar */
.brief{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 4px;margin-top:12px}
.brief-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:4px}
.brief h2{margin:0;font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
[dir="rtl"] .brief h2{font-family:var(--arabic);letter-spacing:0;text-transform:none;font-size:16px}
.brief-h small{font-size:12px;color:var(--muted)}
.brief ul{list-style:none;margin:0;padding:0}
.brief li{display:grid;grid-template-columns:68px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.brief li:first-child{border-top:0}
.brief .tag{display:flex;align-items:flex-start;gap:6px;font-size:11px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.05em;padding-top:3px}
[dir="rtl"] .brief .tag{text-transform:none;letter-spacing:0;font-size:12px;padding-top:2px}
.brief .tag .ti{width:15px;height:15px;margin-top:-1px}
.brief p{margin:0;font-size:15px;line-height:1.45;min-width:0}
.res{margin-top:6px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;background:var(--soft);border-radius:8px;padding:4px 10px}
.recap{display:inline-block;margin-top:6px;margin-inline-start:8px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
.ev.past{background:var(--raised)}
.cal{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;color:var(--muted);border:1px solid var(--line);background:transparent;text-decoration:none}
.cal svg{width:16px;height:16px}
.sub-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
/* New markers, badges, videos */
.new{display:inline-block;vertical-align:middle;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--surface);background:var(--accent);border-radius:5px;padding:2px 6px;line-height:1.4;transition:opacity .6s}
[dir="rtl"] .new{letter-spacing:0;font-size:11px}
.new.gone{opacity:.35}
.ic{position:relative;display:inline-flex}
.badge{position:absolute;top:-5px;inset-inline-end:-11px;min-width:18px;height:18px;border-radius:9px;background:var(--maroc);color:#fff;font-size:11px;font-weight:700;padding:0 5px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.since{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.since h2{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--muted)}
.since-row{display:flex;gap:8px;flex-wrap:wrap}
.since-row button{border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:baseline;gap:6px}
.since-row b{font-family:var(--display);font-size:22px;line-height:1;color:var(--accent)}
.since p{margin:0;font-size:14px;color:var(--muted)}
.topic-h .new{margin-inline-start:6px}
.toolbar{display:flex;justify-content:flex-end;margin-top:8px}
.vid{display:block;position:relative;margin-top:10px;border-radius:10px;overflow:hidden;aspect-ratio:16/9;max-width:100%;background:var(--soft)}
.vid img{width:100%;height:100%;object-fit:cover;display:block}
.vid-l{position:absolute;inset-inline-start:8px;bottom:8px;display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:5px 10px}
.vid-l svg,.vid-link svg{width:14px;height:14px}
.vid-link{display:inline-flex;gap:6px;align-items:center;margin-top:8px;font-weight:600;font-size:13px;color:var(--accent);text-decoration:none}
.videos{display:flex;gap:10px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.videos::-webkit-scrollbar{display:none}
.vcard{flex:0 0 80%;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.vcard .vid{margin-top:0}
.vcard b{display:block;font-size:14px;line-height:1.35;margin-top:8px}
.vcard small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.card a{color:inherit;text-decoration:none}
/* Live update status */
.status{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;font-weight:600;border-radius:10px;padding:8px 12px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line))}
.status.ok{background:color-mix(in srgb,var(--foot) 14%,var(--surface));border-color:color-mix(in srgb,var(--foot) 40%,var(--line))}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 30%,transparent);border-top-color:var(--accent);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* Reader & AI analyses */
.ai{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:999px;padding:4px 10px}
.ai svg{width:14px;height:14px}
.an{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;text-align:start;width:100%;cursor:pointer;color:var(--ink);font:inherit}
.an h3{margin:0;font-size:18px;line-height:1.3;font-weight:700;text-wrap:balance}
.an p{margin:0;font-size:14px;color:var(--muted)}
.an-list{display:grid;gap:10px}
.backbar{display:flex;align-items:center;gap:8px}
.back{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:16px;cursor:pointer;padding:6px 0;display:inline-flex;align-items:center;gap:6px}
.reader{max-width:680px;margin:6px auto 0;display:grid;gap:16px}
.reader h1{margin:0;font-size:26px;line-height:1.25;font-weight:800;text-wrap:balance}
[dir="rtl"] .reader h1{line-height:1.5;font-size:24px}
.reader .dek{margin:0;font-size:17px;line-height:1.5;color:var(--muted)}
.reader h2{margin:8px 0 0;font-size:18px;font-weight:800}
.reader p.body{margin:0;font-size:17px;line-height:1.65}
[dir="rtl"] .reader p.body{line-height:1.9}
.reader ul.pts{margin:0;padding-inline-start:20px;display:grid;gap:10px}
.reader ul.pts li{font-size:17px;line-height:1.55}
.keybox{border-radius:12px;padding:14px 16px;background:color-mix(in srgb,var(--c,var(--accent)) 12%,var(--surface));border-inline-start:4px solid var(--c,var(--accent))}
.keybox b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--c,var(--accent));margin-bottom:4px}
[dir="rtl"] .keybox b{text-transform:none;letter-spacing:0;font-size:13px}
.keybox p{margin:0;font-size:17px;line-height:1.5;font-weight:600}
.srcs{margin:0;padding-inline-start:18px;display:grid;gap:6px;font-size:14px}
.srcs a{color:var(--accent)}
.fine{font-size:13px;color:var(--muted);margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.anlink{display:inline-flex;align-items:center;gap:5px;margin-top:8px;margin-inline-end:10px;font-weight:700;font-size:13px;color:var(--accent);background:transparent;border:0;padding:0;cursor:pointer}
.anlink svg{width:14px;height:14px}
/* Reads */
.reads{display:grid;gap:12px;margin-top:8px}
.read{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.read.done{opacity:.6}
.read a{color:var(--ink);text-decoration:none}
.read h3{margin:0;font-size:17px;line-height:1.35;font-weight:700;text-wrap:balance}
[dir="rtl"] .read h3{line-height:1.55}
.read p{margin:0;font-size:14px;color:var(--muted)}
.why{font-size:14px;line-height:1.5;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border-inline-start:3px solid var(--c)}
.why b{font-weight:700}
.read-f{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:6px;padding:3px 8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--soft);color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);text-decoration:none;display:inline-block}
.empty{margin-top:20px;padding:20px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.toggle,.toggle::after{transition:none}}

const catOn = c => !state.hiddenCats.has(c);

function recentResults(){
  const now=new Date();
  return (state.events||[]).filter(e=>e.result && sportOn(e.sport) && pEnd(e)<now && now-pEnd(e)<3*864e5).sort((a,b)=>pStart(b)-pStart(a));
}
function unseenNews(){ return (state.news||[]).filter(n=>catOn(n.cat)&&!seen.has(n.url)); }
function unseenReads(){ return (state.reads||[]).filter(x=>catOn(x.cat)&&!seen.has(x.url)&&!readDone.has(x.url)); }
const anKey = a => "a:"+a.id;
function analysesList(){ return (state.analyses||[]).filter(a=>catOn(a.cat)).sort((a,b)=>String(b.date).localeCompare(String(a.date))); }
function unseenAnalyses(){ return analysesList().filter(a=>!seen.has(anKey(a))); }
function unseenResults(){ return recentResults().filter(e=>!seen.has(resKey(e))); }
function ensureBaseline(){
  if (seenBaseline || !state.events || !state.news || !state.reads) return;
  (state.news||[]).forEach(n=>seen.add(n.url)); (state.reads||[]).forEach(x=>seen.add(x.url)); recentResults().forEach(e=>seen.add(resKey(e))); (state.analyses||[]).forEach(a=>seen.add(anKey(a)));
  seenBaseline=true; store.set("radar-seen",[...seen]);
}
const newTag = (k) => seen.has(k) ? "" : `<span class="new" data-seen="${esc(k)}">${esc(L().newTag)}</span>`;
function videoBlock(v,compact){
  if (!v || !v.url) return "";
  const t=L(), lab=t.vid[v.kind]||t.vid.promo;
  const id = v.id || ((String(v.url).match(/[?&]v=([\w-]{11})/)||[])[1]) || ((String(v.url).match(/youtu\.be\/([\w-]{11})/)||[])[1]);
  if (window.RADAR_PWA && id && !compact) return `<a class="vid" href="${esc(v.url)}" target="_blank" rel="noopener" aria-label="${esc(lab)}"><img src="https://i.ytimg.com/vi/${esc(id)}/mqdefault.jpg" alt="" loading="lazy" onerror="this.remove()"><span class="vid-l">${ICONS.play}${esc(lab)}</span></a>`;
  return `<a class="vid-link" href="${esc(v.url)}" target="_blank" rel="noopener">${ICONS.play}${esc(lab)}</a>`;
}
function gcalLink(ev){
  const pad=n=>String(n).padStart(2,"0");
  const z=d=>`${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
  const day=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  let dates;
  if (isDateOnly(ev)){ const s=pStart(ev), e=new Date(pEnd(ev)); e.setDate(e.getDate()+1); dates=`${day(s)}/${day(sod(e))}`; }
  else { const s=pStart(ev); dates=`${z(s)}/${z(new Date(s.getTime()+2*3600e3))}`; }
  const q=new URLSearchParams({action:"TEMPLATE",text:ev.title,dates,location:ev.place||"",details:`${ev.comp||""}${ev.why?" — "+ev.why:""}`});
  return "https://calendar.google.com/calendar/render?"+q.toString();
}
const calHref = ev => window.RADAR_PWA ? `ics/${encodeURIComponent(ev.id)}.ics` : gcalLink(ev);
function upcoming(){
  const now=new Date();
  return (state.events||[]).filter(e=>pEnd(e)>=now && sportOn(e.sport)).sort((a,b)=>pStart(a)-pStart(b)||(b.level-a.level));
}

function renderTop(){
  if (state.detail){
    const t=L();

    const opts=[["all",t.all,null],...Object.keys(SPORT_C).filter(sportOn).map(k=>[k,t.sports[k],SPORT_C[k]]),["fav",t.fav,null]];

    chips = `<div class="chips" role="toolbar">${opts.map(([k,l,c])=>`<button class="chip" data-cf="${k}" aria-pressed="${state.catFilter===k}">${c?`<span class="ti" style="--c:var(${c})">${TI[k]||""}</span>`:""}${esc(l)}</button>`).join("")}</div>`;
  } else if (state.tab==="reads"){
    const have=new Set((state.reads||[]).map(x=>x.cat));
    const opts=[["all",t.allNews,null],["unread",t.unread,null],...Object.keys(CAT_C).filter(k=>catOn(k)&&have.has(k)).map(k=>[k,t.cats[k],CAT_C[k]])];
    chips = `<div class="chips" role="toolbar">${opts.map(([k,l,c])=>`<button class="chip" data-rf="${k}" aria-pressed="${state.readFilter===k}">${c?`<span class="ti" style="--c:var(${c})">${TI[k]||""}</span>`:""}${esc(l)}</button>`).join("")}</div>`;
  }
  let statusHtml="";
  if (live.done && Date.now()-live.done<8000) statusHtml=`<div class="status ok" role="status">${esc(t.updDone)}</div>`;
  else if (live.running) statusHtml=`<div class="status" role="status"><span class="spin" aria-hidden="true"></span>${esc(t.updRunning(fmt(new Date(live.running),{hour:"2-digit",minute:"2-digit",hour12:false})))}</div>`;

  $("#top").querySelectorAll("[data-cf]").forEach(b=>b.onclick=()=>{state.catFilter=b.dataset.cf;render(true);});
  $("#top").querySelectorAll("[data-rf]").forEach(b=>b.onclick=()=>{state.readFilter=b.dataset.rf;render(true);});
}
function renderNav(){
  const t=L();
  const ready = state.events && state.news && state.reads && seenBaseline;
  const cnt = ready ? {agenda:unseenResults().length, news:unseenNews().length, reads:unseenReads().length+unseenAnalyses().length} : {};

function eventRow(ev){
  const t=L(), c=SPORT_C[ev.sport]||"--muted", s=pStart(ev), now=new Date(), lv=Number(ev.level)||1;

      ${ev.video ? videoBlock(ev.video,true) : ""}${(()=>{ const a=(state.analyses||[]).find(z=>z.event===ev.id); return a?`<button class="anlink" data-open="an" data-k="${esc(a.id)}">${ICONS.spark}${esc(t.readAnalysis)}</button>`:""; })()}
    </div>

function newsLabel(n){

  const key = (n.cat==="sport" && TI[n.sport]) ? n.sport : n.cat;
  return {label,col,key};
}
const shortDate = s => { try{ return fmt(ymd(s),{day:"numeric",month:"short"}); }catch(e){ return ""; } };

/* ---------- views ---------- */
function viewHome(){
  const t=L(); const evs=upcoming(); const now=new Date();
  const next = evs.find(e=>e.level>=3 && pStart(e)>now) || evs.find(e=>pStart(e)>now);
  let html="";
  const brief = state.meta && (state.lang==="ar" ? state.meta.brief_ar : state.meta.brief);
  const BRIEF_K = {sport:"sport",maroc:"maroc",monde:"geo",tech:"tech",culture:"culture","رياضة":"sport","المغرب":"maroc","العالم":"geo","تكنولوجيا":"tech","ثقافة":"culture"};
  const BRIEF_C = {sport:"--foot",maroc:"--maroc",monde:"--geo",tech:"--tech",culture:"--art","رياضة":"--foot","المغرب":"--maroc","العالم":"--geo","تكنولوجيا":"--tech","ثقافة":"--art"};
  const briefHtml = (Array.isArray(brief) && brief.length) ? `<section class="brief"><div class="brief-h"><h2>${esc(t.briefTitle)}</h2>${state.meta.updatedAt?`<small>${esc(fmt(new Date(state.meta.updatedAt),{hour:"2-digit",minute:"2-digit",hour12:false}))}</small>`:""}</div><ul>${brief.map(x=>{
      const m=String(x).match(/^\s*([^:：]{2,16})\s*[:：]\s*(.+)$/s);
      const lab=m?m[1].trim():"", raw=m?m[2]:String(x), txt=raw.charAt(0).toUpperCase()+raw.slice(1), key=lab.toLowerCase();
      return `<li style="--c:var(${BRIEF_C[key]||BRIEF_C[lab]||"--accent"})"><span class="tag">${ico(BRIEF_K[key]||BRIEF_K[lab])}${esc(lab)}</span><p>${esc(txt)}</p></li>`;
    }).join("")}</ul></section>` : "";
  if (next){
    const c=SPORT_C[next.sport]||"--accent";
    html += `<section class="next" style="--c:var(${c})" aria-live="polite">
      <div class="next-count" id="count" data-start="${pStart(next).toISOString()}" data-dateonly="${isDateOnly(next)?1:0}"></div>
      <div class="min">
        <div class="lbl" style="display:flex;align-items:center;gap:6px">${ico(next.sport)}<span>${esc(t.next)} · ${esc(t.sports[next.sport]||"")}</span></div>
        <h3>${esc(tx(next,"title"))}</h3>
        <p>${esc(tx(next,"comp"))} · ${esc(tx(next,"place"))}</p>
        <p class="when">${esc(isDateOnly(next) ? fmt(pStart(next),{weekday:"long",day:"numeric",month:"long"}) : fmt(pStart(next),{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit",hour12:false}))}</p>
      </div>
    </section>`;
  }
  html += briefHtml;
  if (seenBaseline){
    const nN=unseenNews().length, nR=unseenReads().length, nX=unseenResults().length;
    html += `<section class="since">${(nN||nR||nX) ? `<h2>${esc(t.sinceTitle)}</h2><div class="since-row">${nX?`<button data-go="agenda"><b>${nX}</b>${esc(t.sinceRes)}</button>`:""}${nN?`<button data-go="news"><b>${nN}</b>${esc(t.sinceNews)}</button>`:""}${nR?`<button data-go="reads"><b>${nR}</b>${esc(t.sinceReads)}</button>`:""}</div>` : `<p>✓ ${esc(t.upToDate)}</p>`}</section>`;
  }
  const anTop = analysesList()[0];
  if (anTop) html += `<section class="sec"><div class="sec-h"><h2>${esc(t.analysisOfDay)}</h2><button class="link" data-go="reads">${esc(t.analyses)}</button></div>${anCard(anTop)}</section>`;
  const week = evs.filter(e=>e!==next && e.level>=3).slice(0,5);
  const resNow = recentResults().slice(0,3);
  html += `<section class="sec"><div class="sec-h"><h2>${esc(t.week)}</h2><button class="link" data-go="agenda">${esc(t.seeAgenda)}</button></div>`;
  html += week.length ? `<div class="list">${week.map(eventRow).join("")}</div>` : `<div class="empty">${esc(t.weekEmpty)}</div>`;
  html += `</section>`;
  if (resNow.length) html += `<section class="sec"><div class="sec-h"><h2>${esc(t.results)}</h2></div><div class="list">${resNow.map(eventRow).join("")}</div></section>`;
  const vids = [
    ...recentResults().filter(e=>e.video).map(e=>({v:e.video,title:tx(e,"title")+(e.result?" · "+tx(e,"result"):""),sub:tx(e,"comp")})),
    ...(state.news||[]).filter(n=>n.video&&catOn(n.cat)).sort(byDate).map(n=>({v:n.video,title:tx(n,"title"),sub:n.source||""})),
    ...upcoming().filter(e=>e.video).map(e=>({v:e.video,title:tx(e,"title"),sub:tx(e,"comp")}))
  ].slice(0,6);
  if (vids.length) html += `<section class="sec"><div class="sec-h"><h2>${esc(t.toWatch)}</h2></div><div class="videos">${vids.map(x=>`<div class="vcard">${videoBlock(x.v)}<b>${esc(x.title)}</b><small>${esc(x.sub)}</small></div>`).join("")}</div></section>`;
  const tonight = readsList().filter(x=>!readDone.has(x.url)).slice(0,2);
  if (tonight.length){
    html += `<section class="sec"><div class="sec-h"><h2>${esc(t.readTonight)}</h2><button class="link" data-go="reads">${esc(t.seeReads)}</button></div><div class="reads" style="margin-top:0">${tonight.map(readCard).join("")}</div></section>`;
  }
  const cats = Object.keys(CAT_C).filter(catOn);
  const heads = cats.map(c=>newsFor(c)[0]).filter(Boolean);
  if (heads.length){
    html += `<section class="sec"><div class="sec-h"><h2>${esc(t.headlines)}</h2><button class="link" data-go="news">${esc(t.seeNews)}</button></div><div class="digest">`;
    html += heads.map(n=>{ const {col}=newsLabel(n); return `<a href="${esc(n.url)}" target="_blank" rel="noopener" style="--c:var(${CAT_C[n.cat]})"><span class="tag">${ico(n.cat)}${esc(t.cats[n.cat])}</span><b>${esc(tx(n,"title"))}</b></a>`; }).join("");
    html += `</div></section>`;
  }
  return html;
}
function viewAgenda(){
  const t=L(), now=new Date();
  let evs = upcoming();
  if (state.sportFilter==="fav") evs=evs.filter(e=>stars.has(e.id));
  else if (state.sportFilter!=="all") evs=evs.filter(e=>e.sport===state.sportFilter);
  let past = recentResults();
  if (state.sportFilter==="fav") past=past.filter(e=>stars.has(e.id)); else if (state.sportFilter!=="all") past=past.filter(e=>e.sport===state.sportFilter);
  if (!evs.length && !past.length) return `<div class="empty">${esc(state.sportFilter==="fav"?t.favEmpty:t.noEvents)}</div>`;
  const live = evs.filter(e=>pStart(e)<=now);
  const groups=new Map();
  evs.filter(e=>pStart(e)>now).forEach(e=>{const k=dayKey(pStart(e)); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(e);});
  let html="";
  if (past.length) html += `<section class="day"><div class="dayhead"><b>${esc(t.results)}</b></div><div class="list">${past.map(eventRow).join("")}</div></section>`;
  if (live.length) html += `<section class="day"><div class="dayhead"><b>${esc(t.now)}</b><small class="soon">${esc(t.live)}</small></div><div class="list">${live.map(eventRow).join("")}</div></section>`;
  for (const [,list] of groups){ const d=pStart(list[0]), r=rel(d);
    html += `<section class="day"><div class="dayhead"><b>${esc(fmt(d,{weekday:"long",day:"numeric",month:"long"}))}</b><small class="${r.soon?"soon":""}">${esc(r.t)}</small></div><div class="list">${list.map(eventRow).join("")}</div></section>`; }
  html += `<div class="legend">${t.legend.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`;
  return html;
}
function viewNews(){
  const t=L();
  const un=unseenNews().length;
  const bar = un ? `<div class="toolbar"><button class="link" data-seenall="news">${esc(t.markAllSeen)}</button></div>` : "";
  if (state.catFilter!=="all"){
    const items=newsFor(state.catFilter);
    return items.length ? `${bar}<div class="news" style="margin-top:8px">${items.map(newsCard).join("")}</div>` : `<div class="empty">${esc(t.noNews)}</div>`;
  }
  const cats=Object.keys(CAT_C).filter(catOn);
  const blocks = cats.map(c=>{ const items=newsFor(c); if(!items.length) return "";
    const fresh=items.filter(n=>!seen.has(n.url)), old=items.filter(n=>seen.has(n.url));
    const shown=[...fresh, ...old].slice(0, Math.max(3, fresh.length));
    return `<section class="topic" style="--c:var(${CAT_C[c]})">
      <div class="topic-h"><div class="meta">${ico(c)}${esc(t.cats[c])}${fresh.length?` <span class="new">${esc(t.nNew(fresh.length))}</span>`:""}</div>${items.length>shown.length?`<button class="link" data-cat="${c}">${esc(t.seeAll(items.length))}</button>`:""}</div>
      ${shown.map(n=>`<a href="${esc(n.url)}" target="_blank" rel="noopener"><b>${seen.has(n.url)?"":`<span class="new" data-seen="${esc(n.url)}">${esc(t.newTag)}</span> `}${esc(tx(n,"title"))}${n.video?` <span style="color:var(--accent)">▶</span>`:""}</b><small>${esc(n.source||"")} · ${esc(shortDate(n.date))}</small></a>`).join("")}
    </section>`; }).join("");
  return blocks ? `${bar}<div style="margin-top:8px">${blocks}</div>` : `<div class="empty">${esc(t.noNews)}</div>`;
}
function viewSettings(){
  const t=L();
  const sp = Object.keys(SPORT_C).map(k=>`<div class="row"><label for="sp-${k}"><span class="ti" style="--c:var(${SPORT_C[k]})">${TI[k]}</span>${esc(t.sports[k])}</label><input type="checkbox" class="toggle" id="sp-${k}" data-sp="${k}" ${sportOn(k)?"checked":""}></div>`).join("");
  const ct = Object.keys(CAT_C).map(k=>`<div class="row"><label for="ct-${k}"><span class="ti" style="--c:var(${CAT_C[k]})">${TI[k]}</span>${esc(t.cats[k])}</label><input type="checkbox" class="toggle" id="ct-${k}" data-ct="${k}" ${catOn(k)?"checked":""}></div>`).join("");
  const base = `${location.host}${location.pathname.replace(/[^/]*$/,"")}`;
  const calSec = window.RADAR_PWA ? `<section class="sec"><div class="sec-h"><h2>${esc(t.calTitle)}</h2></div><div class="panel"><p class="note" style="margin:12px 0 4px">${esc(t.calSub)}</p><div class="sub-row"><a class="btn primary" href="webcal://${base}ics/incontournables.ics">${esc(t.calBtn)}</a><a class="link" href="webcal://${base}ics/tout.ics">${esc(t.calAll)}</a></div></div></section>` : "";
  return calSec + `<section class="sec"><div class="sec-h"><h2>${esc(t.lang)}</h2></div>
      <div class="seg" role="group"><button lang="fr" data-lang="fr" aria-pressed="${state.lang==="fr"}">Français</button><button lang="ar" data-lang="ar" aria-pressed="${state.lang==="ar"}">العربية</button></div></section>
    <section class="sec"><div class="sec-h"><h2>${esc(t.mySports)}</h2></div><div class="panel">${sp}</div></section>
    <section class="sec"><div class="sec-h"><h2>${esc(t.myTopics)}</h2></div><div class="panel">${ct}</div><p class="note">${esc(t.settingsNote)}</p></section>`;
}

let seenObs=null;
function observeSeen(){
  if (seenObs) seenObs.disconnect();
  if (!("IntersectionObserver" in window)) return;
  const timers=new Map();
  seenObs = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      const el=en.target, k=el.dataset.seen;
      if (en.isIntersecting){
        if (!timers.has(el)) timers.set(el, setTimeout(()=>{ seen.add(k); saveSeen(); el.classList.add("gone"); seenObs.unobserve(el); timers.delete(el); renderNav(); }, 1500));
      } else if (timers.has(el)){ clearTimeout(timers.get(el)); timers.delete(el); }
    });
  }, {threshold:0.9});
  document.querySelectorAll("#main [data-seen]").forEach(el=>seenObs.observe(el));
}
function bind(){
  const m=$("#main");
  m.querySelectorAll("[data-open]").forEach(b=>b.onclick=(e)=>{ e.preventDefault(); openDetail(b.dataset.open,b.dataset.k); });
  m.querySelectorAll("[data-seenall]").forEach(b=>b.onclick=()=>{ (b.dataset.seenall==="news"?unseenNews():unseenReads()).forEach(x=>seen.add(x.url)); store.set("radar-seen",[...seen].slice(-2000)); render(); });
  m.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>{ const id=b.dataset.star; stars.has(id)?stars.delete(id):stars.add(id); store.set("radar-stars",[...stars]); render(); });
  m.querySelectorAll("[data-read]").forEach(b=>b.onclick=()=>{ const u=b.dataset.read; readDone.has(u)?readDone.delete(u):readDone.add(u); store.set("radar-read",[...readDone].slice(-300)); render(); });
  m.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ if(b.dataset.go==="news") state.catFilter="all"; go(b.dataset.go); });
  m.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>go("news",{cat:b.dataset.cat}));
  m.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ state.lang=b.dataset.lang; store.set("radar-lang2",state.lang); render(); });
  m.querySelectorAll("[data-sp]").forEach(i=>i.onchange=()=>{ i.checked?state.hiddenSports.delete(i.dataset.sp):state.hiddenSports.add(i.dataset.sp); store.set("radar-hidden-sports",[...state.hiddenSports]); if(!sportOn(state.sportFilter)) state.sportFilter="all"; });
  m.querySelectorAll("[data-ct]").forEach(i=>i.onchange=()=>{ i.checked?state.hiddenCats.delete(i.dataset.ct):state.hiddenCats.add(i.dataset.ct); store.set("radar-hidden-cats",[...state.hiddenCats]); if(!catOn(state.catFilter)) state.catFilter="all"; });
}
function tick(){
  const el=document.getElementById("count"); if(!el) return;
  const t=L(), start=new Date(el.dataset.start), now=new Date();
  let ms=start-now;
  if (ms<=0){ el.innerHTML=`<b>●</b><span>${esc(t.started)}</span>`; return; }
  if (el.dataset.dateonly==="1"){
    const n=Math.round((sod(start)-sod(now))/864e5);
    el.innerHTML = n<=0 ? `<b>0</b><span>${esc(t.todayShort)}</span>` : `<b>${n}</b><span>${esc(n===1?t.day1:t.days)}</span>`;
    return;
  }
  const d=Math.floor(ms/864e5); ms-=d*864e5; const h=Math.floor(ms/36e5); ms-=h*36e5; const mi=Math.floor(ms/6e4);
  el.innerHTML = d>=1 ? `<b>${d}</b><span>${esc(d===1?t.day1:t.days)} · ${h}${esc(t.hours)}</span>` : `<b>${h}:${String(mi).padStart(2,"0")}</b><span>${esc(t.before)}</span>`;
}
setInterval(tick, 30000);

function render(scrollTop){
  ensureBaseline();
  const app=$("#app"); app.dir = state.lang==="ar"?"rtl":"ltr"; app.lang=state.lang;
  document.documentElement.lang = state.lang;
  renderTop(); renderNav();
  const m=$("#main");
  if (state.tab!=="settings" && (!state.events || !state.news || !state.reads)) m.innerHTML = `<div class="empty">${esc(state.err?L()[state.err]:L().loading)}</div>`;
  else if (state.detail) m.innerHTML = viewDetail();
  else m.innerHTML = state.tab==="home"?viewHome():state.tab==="agenda"?viewAgenda():state.tab==="news"?viewNews():state.tab==="reads"?viewReads():viewSettings();
  bind(); tick(); observeSeen();
  if (scrollTop) window.scrollTo(0,0);
}
render();

/* ---------- data: Claude database when opened in Claude, data.json when installed as an app ---------- */
async function pollStatus(){
  try{
    const r = await fetch("status.json?ts="+Date.now(),{cache:"no-store"});
    if (!r.ok) return;
    const st = await r.json();
    const started = st && st.state==="running" && st.startedAt ? new Date(st.startedAt).getTime() : 0;
    const dataAt = state.meta && state.meta.updatedAt ? new Date(state.meta.updatedAt).getTime() : 0;
    const fresh = started && Date.now()-started < 45*60e3;
    const was = live.running;
    live.running = (fresh && dataAt < started) ? started : null;
    if (live.running){ await loadJson(true); }
    if (was && !live.running){ live.done = Date.now(); setTimeout(()=>renderTop(),8500); }
    renderTop();
  }catch(e){}
}
function apply(d){ state.events=Array.isArray(d.events)?d.events:[]; state.news=Array.isArray(d.news)?d.news:[]; state.reads=Array.isArray(d.reads)?d.reads:[]; state.analyses=Array.isArray(d.analyses)?d.analyses:[]; state.meta=d.meta||null; render(); }
async function loadJson(quiet){
  try{
    const r = await fetch("data.json",{cache:"no-cache"});
    if(!r.ok) throw 0;
    const d = await r.json();
    const prev = state.meta && state.meta.updatedAt;
    if (quiet && prev && d.meta && d.meta.updatedAt===prev) return;
    apply(d);
    state.offline = r.headers.get("x-radar-offline")==="1"; render();
  }catch(e){ state.err = "fail"; render(); }
}
(async()=>{
  if (!window.RADAR_PWA){
    let db=null; try{ db=await window.claude?.use?.("db"); }catch(e){}
    if (!db){ state.err="noDb"; render(); return; }
    const fail=()=>{ state.err="fail"; render(); };
    db.doc("feed/events").onSnapshot(s=>{ const d=s.exists?s.data():null; state.events=d&&Array.isArray(d.items)?d.items:[]; render(); }, fail);
    db.doc("feed/news").onSnapshot(s=>{ const d=s.exists?s.data():null; state.news=d&&Array.isArray(d.items)?d.items:[]; render(); }, fail);
    db.doc("feed/analyses").onSnapshot(s=>{ const d=s.exists?s.data():null; state.analyses=d&&Array.isArray(d.items)?d.items:[]; render(); }, ()=>{});
    db.doc("feed/reads").onSnapshot(s=>{ const d=s.exists?s.data():null; state.reads=d&&Array.isArray(d.items)?d.items:[]; render(); }, fail);
    db.doc("feed/meta").onSnapshot(s=>{ state.meta=s.exists?s.data():null; render(); }, ()=>{});
  } else {
    loadJson().then(pollStatus);
    setInterval(()=>{ if(document.visibilityState==="visible") pollStatus(); }, 60000);
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") loadJson().then(pollStatus); });
  }
})();
</script>
